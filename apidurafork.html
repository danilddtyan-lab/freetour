<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Apidura fork Pack</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

/* страница товара */
.product-page {
    max-width: 1100px;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
}

/* сетка */
.product-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
}

/* главное фото */
.main-image {
    width: 100%;
    border-radius: 10px;
}

/* мини фото */
.thumbnails {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.thumbnails img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    cursor: pointer;
    opacity: 0.6;
    border-radius: 6px;
    transition: 0.3s;
}

.thumbnails img:hover,
.thumbnails img.active {
    opacity: 1;
    border: 2px solid orange;
}

/* текст */
.product-title {
    font-size: 32px;
    margin-bottom: 10px;
}

.product-price {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
}

.product-description {
    line-height: 1.7;
    margin-bottom: 25px;
}

/* кнопка */
.item-button {
    display: inline-block;
    padding: 12px 20px;
    background: orange;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

/* назад */
.back-link {
    display: inline-block;
    margin-top: 30px;
    text-decoration: none;
    color: black;
    opacity: 0.7;
}

</style>
</head>

<body>

<!-- ХЕДЕР -->
<header class="header-boxed">

    <div class="header-left">

        <img src="Picsart_26-02-12_18-29-18-194.png" class="logo-big" alt="logo">

        <div class="header-text">
            <h1>Freetour</h1>
            <p>все для байкпакинга</p>
        </div>

    </div>

    <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="onas.html">О нас</a>
        <a href="contacts.html">Контакты</a>
    </nav>

</header>

<!-- ТОВАР -->
<div class="product-page">

    <div class="product-wrapper">

        <!-- фото -->
        <div>

            <img id="mainImage"
                 src="tb_image_share_1770908212687.png"
                 class="main-image"
                 alt="товар">

            <div class="thumbnails">

               <img src="apidura-apidura-expedition-fork-pack-3l.jpg" class="thumb active">
               <img src="Apidura-Expedition-Fork-Pack-Review-13.jpg" class="thumb">
               <img src="Apidura-Expedition-Fork-Pack-Review-Share.jpg" class="thumb">

            </div>

        </div>

        <!-- текст -->
        <div>

            <h1 class="product-title">Apidura Fork Pack</h1>

            <div class="product-price">10000 сом</div>

            <div class="product-description">
                Apidura Fork Pack — лёгкая и прочная сумка для байкпакинга, которая крепится на вилку велосипеда через cargo cage.
            </div>

            <a href="https://instagram.com/freetour.kg" class="item-button">
                Заказать
            </a>

            <br>

            <a href="index.html" class="back-link">
                ← Вернуться в каталог
            </a>

        </div>

    </div>

</div>

<!-- JS ЛИСТАНИЕ ФОТО -->
<script>

const mainImage = document.getElementById("mainImage");
const thumbs = document.querySelectorAll(".thumb");

let currentIndex = 0;

// смена фото
function setImage(index) {
    currentIndex = index;
    mainImage.src = thumbs[index].src;

    thumbs.forEach(t => t.classList.remove("active"));
    thumbs[index].classList.add("active");
}

// клик по миниатюрам
thumbs.forEach((img, index) => {
    img.addEventListener("click", () => {
        setImage(index);
    });
});

</script>

</body>
</html>
