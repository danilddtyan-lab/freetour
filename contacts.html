<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакты | Freetour</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:url("2023-Silk-Road-Mountain-Race-Josh-Ibbett_1.jpg") no-repeat center center/cover;
min-height:100vh;
color:white;
position:relative;
}

body::before{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(3px);
z-index:0;
}

/* Шапка сайта */
.header{
position:relative;
z-index:2;
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 60px;
}

.logo{
font-size:28px;
font-weight:bold;
}

.nav{
display:flex;
gap:25px;
}

.nav a{
color:white;
text-decoration:none;
opacity:0.8;
transition:0.3s;
}

.nav a:hover{
opacity:1;
}

.active{
color:#ff6a00;
opacity:1;
}

/* Основная часть */
.main{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
padding:40px 20px 80px;
gap:40px;
}

/* Карточки */
.card{
width:100%;
max-width:700px;
padding:40px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 15px 40px rgba(0,0,0,0.6);
animation:fadeUp .8s ease forwards;
opacity:0;
}

/* Анимация появления */
@keyframes fadeUp{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1{
text-align:center;
margin-bottom:25px;
}

/* Фото компании */
.company-photo{
width:100%;
height:300px;
object-fit:cover;
border-radius:15px;
margin-bottom:25px;
}

/* Блок с контактами */
.contact-info{
line-height:2;
font-size:18px;
opacity:0.9;
}

/* Карта */
iframe{
width:100%;
height:250px;
border-radius:15px;
border:none;
}

/* Адаптация под телефон */
@media(max-width:768px){

.header{
flex-direction:column;
gap:10px;
padding:20px;
}

.nav{
gap:15px;
}

.card{
padding:25px;
}

.company-photo{
height:220px;
}

}
</style>
</head>

<body>

<!-- Шапка -->
<header class="header">

<div class="logo">
Freetour
</div>

<nav class="nav">
<a href="index.html">Главная</a>
<a href="onas.html">О нас</a>
<a href="#" class="active">Контакты</a>
</nav>

</header>

<!-- Основной контент -->
<main class="main">

<!-- Карточка с контактами -->
<div class="card">

<h1>Наши контакты</h1>

<!-- Фото -->
<img 
src="photo.jpg" 
alt="Freetour"
class="company-photo"
>

<!-- Контактная информация -->
<div class="contact-info">

📞 Телефон: +996 222 411 222 <br>

✉ Email: freetour@gmail.com <br>

📍 Адрес: Бишкек, Кыргызстан <br>

🕒 Время работы: 09:00 – 21:00 <br>

🌍 Instagram: @freetour.kg <br>

🚴 Туристические туры по Кыргызстану

</div>

</div>

<!-- Карта -->
<div class="card">

<h1>Мы на карте</h1>

<iframe
src="https://www.google.com/maps?q=Бишкек&output=embed">
</iframe>

</div>

</main>

</body>
</html>
